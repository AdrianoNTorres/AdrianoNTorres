<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="in-progress"><style>
.r{transform-origin:8px 8px;animation:r 1.6s ease-out infinite}
.c{animation:c 1.6s ease-in-out infinite}
@keyframes r{0%{transform:scale(.4);opacity:1}80%,100%{transform:scale(1.15);opacity:0}}
@keyframes c{0%,100%{opacity:1}50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.r{animation:none;opacity:0}.c{animation:none}}
</style><circle class="r" cx="8" cy="8" r="7" fill="#d29922"/><circle class="c" cx="8" cy="8" r="3.5" fill="#d29922"/></svg>
