<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="in-progress"><defs><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>
<style>
.r{transform-origin:12px 12px;animation:r 1.6s ease-out infinite}
.c{animation:c 1.6s ease-in-out infinite}
@keyframes r{0%{transform:scale(.3);opacity:1}75%,100%{transform:scale(1);opacity:0}}
@keyframes c{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.r{animation:none;opacity:0}.c{animation:none}}
</style>
<circle class="r" cx="12" cy="12" r="11" fill="#ffc83d" filter="url(#g)"/>
<circle class="c" cx="12" cy="12" r="4.5" fill="#ffc83d"/></svg>
