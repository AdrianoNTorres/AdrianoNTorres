<svg xmlns="http://www.w3.org/2000/svg" width="504" height="166" viewBox="0 0 504 166" role="img" aria-label="GraphsOfNorms: Visualizes mathematical norms. Built with Python, PySide6. Status: Finished.">
<defs><filter id="soft" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.2"/></filter></defs>
<style>
text{font-family:"Segoe UI",-apple-system,"Helvetica Neue",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.3s ease-out infinite}
.core{animation:core 1.3s ease-in-out infinite}
@keyframes ring{0%{transform:scale(.3);opacity:1}75%,100%{transform:scale(1.5);opacity:0}}
@keyframes core{0%,100%{opacity:1}50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.ring{animation:none;opacity:0}.core{animation:none}}
</style>
<rect x="0.5" y="0.5" width="487" height="149" rx="14" fill="#111c2b" stroke="#263241"/>
<rect x="0.5" y="24" width="4" height="52" rx="2" fill="#3fb950"/>
<text x="24" y="40" font-size="19" font-weight="700" fill="#f0f6fc">GraphsOfNorms</text>
<text x="24" y="70" font-size="14" fill="#c9d4e0">Visualizes mathematical norms.</text>
<text class="mono" x="24" y="134" font-size="12.5" fill="#3fff6b">Python, PySide6</text>
<circle class="" cx="448" cy="34" r="4.5" fill="#3fb950"/>
<text x="436" y="39" font-size="12.5" fill="#8b9bb0" text-anchor="end">Finished</text>
</svg>
