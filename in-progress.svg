<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" role="img" aria-label="in-progress"><style>
.ring{transform-origin:8px 8px;animation:p 2.6s ease-out infinite}
@keyframes p{0%{transform:scale(.55);opacity:.8}70%,100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.ring{animation:none;opacity:0}}
</style><circle class="ring" cx="8" cy="8" r="7" fill="#d29922"/><circle cx="8" cy="8" r="4" fill="#d29922"/></svg>
